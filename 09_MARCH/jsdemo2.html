<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type = "text/Javascript">
    function add(){
        var total;
        var first = parseFloat(document.getElementById("text1").value);
        var second = parseFloat(document.getElementById("text2").value); 
        var total = first + second;

        alert("Sum = " + total);
       }     
    </script>
    <pre>
        1st Number :<input type ="text" id = "text1"  placeholder="Enter 1st number ">
        
        2nd Number :<input type ="text" id = "text2" placeholder="Enter 2nd number ">
        <input type = "button" value = "sum " onclick="add()" />
    </pre>
</body>
</html>
